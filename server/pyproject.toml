[project]
name = "okf-memory-server"
version = "0.1.0"
description = "FastAPI server that turns voice/photo captures into OKF v0.2 memories"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openai>=1.60",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
