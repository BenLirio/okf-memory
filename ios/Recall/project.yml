name: Recall
options:
  bundleIdPrefix: com.benlirio
  deploymentTarget:
    iOS: "17.0"
targets:
  Recall:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benlirio.recall
        DEVELOPMENT_TEAM: Z8S4W8C57D
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Recall records voice notes to turn them into memories, and voice questions to answer them."
        INFOPLIST_KEY_NSCameraUsageDescription: "Recall captures photos to turn them into memories."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.benlirio.recall.refresh]
